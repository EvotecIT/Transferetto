            - name: Restore dependencies
              run: dotnet restore Transferetto.sln

            - name: Build solution
              run: dotnet build Transferetto.sln --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore

            - name: Run tests (.NET 8.0)
              run: dotnet test Sources/Transferetto.Tests/Transferetto.Tests.csproj --configuration ${{ env.BUILD_CONFIGURATION }} --framework net8.0 --no-build --verbosity ${{ env.TEST_VERBOSITY }} --logger "console;verbosity=${{ env.TEST_VERBOSITY }}" --logger trx --collect:"XPlat Code Coverage"

            - name: Summarize failing tests
              if: failure() && env.SUMMARIZE_FAILURES == 'true'
              shell: pwsh
              run: |
                  $trxFiles = Get-ChildItem -Recurse -Filter *.trx
                  if ($trxFiles.Count -eq 0) {
                    Write-Host "No TRX files found for failure analysis"
                    exit 0
                  }

                  Write-Host "=== Failed Tests Summary ==="
                  $failureCount = 0

                  $trxFiles | ForEach-Object {
                    try {
                      Select-Xml -Path $_.FullName -XPath "//UnitTestResult[@outcome='Failed']" |
                        ForEach-Object {
                          $name = $_.Node.testName
                          $msg = $_.Node.Output.ErrorInfo.Message ?? "No error message available"
                          Write-Host "FAILED: $name"
                          Write-Host "   $msg"
                          $failureCount++
                        }
                    } catch {
                      Write-Host "Warning: Could not parse TRX file $($_.Name): $($_.Exception.Message)"
                    }
                  }

                  if ($failureCount -eq 0) {
                    Write-Host "No failed tests found in TRX files"
                  } else {
                    Write-Host "=== Total failed tests: $failureCount ==="
                  }

            - name: Upload test results
              uses: actions/upload-artifact@v7
              if: always()
              with:
                  name: test-results-ubuntu
                  path: '**/*.trx'

            - name: Upload coverage reports
              uses: actions/upload-artifact@v7
              if: always()
              with:
                  name: coverage-reports-ubuntu
                  path: '**/coverage.cobertura.xml'

    test-macos:
        name: macOS
        runs-on: macos-latest
        timeout-minutes: 15
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup .NET
              uses: actions/setup-dotnet@v6
              with:
                  dotnet-version: ${{ env.DOTNET_VERSION }}

            - name: Restore dependencies
              run: dotnet restore Transferetto.sln

            - name: Build solution
              run: dotnet build Transferetto.sln --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore

            - name: Run tests (.NET 8.0)
              run: dotnet test Sources/Transferetto.Tests/Transferetto.Tests.csproj --configuration ${{ env.BUILD_CONFIGURATION }} --framework net8.0 --no-build --verbosity ${{ env.TEST_VERBOSITY }} --logger "console;verbosity=${{ env.TEST_VERBOSITY }}" --logger trx --collect:"XPlat Code Coverage"

            - name: Summarize failing tests
              if: failure() && env.SUMMARIZE_FAILURES == 'true'
              shell: pwsh
              run: |
                  $trxFiles = Get-ChildItem -Recurse -Filter *.trx
                  if ($trxFiles.Count -eq 0) {
                    Write-Host "No TRX files found for failure analysis"
                    exit 0
                  }

                  Write-Host "=== Failed Tests Summary ==="
                  $failureCount = 0

                  $trxFiles | ForEach-Object {
                    try {
                      Select-Xml -Path $_.FullName -XPath "//UnitTestResult[@outcome='Failed']" |
                        ForEach-Object {
                          $name = $_.Node.testName
                          $msg = $_.Node.Output.ErrorInfo.Message ?? "No error message available"
                          Write-Host "FAILED: $name"
                          Write-Host "   $msg"
                          $failureCount++
                        }
                    } catch {
                      Write-Host "Warning: Could not parse TRX file $($_.Name): $($_.Exception.Message)"
                    }
                  }

                  if ($failureCount -eq 0) {
                    Write-Host "No failed tests found in TRX files"
                  } else {
                    Write-Host "=== Total failed tests: $failureCount ==="
                  }

            - name: Upload test results
              uses: actions/upload-artifact@v7
              if: always()
              with:
                  name: test-results-macos
                  path: '**/*.trx'

            - name: Upload coverage reports
              uses: actions/upload-artifact@v7
              if: always()
              with:
                  name: coverage-reports-macos
                  path: '**/coverage.cobertura.xml'
