name: Test .NET

on:
    push:
        branches:
            - master
        paths-ignore:
            - '*.md'
            - 'Docs/**'
            - 'Examples/**'
            - 'Website/**'
            - '.gitignore'
    pull_request:
        branches:
            - master
    workflow_dispatch:

permissions:
    contents: read

env:
    DOTNET_VERSION: '10.x'
    BUILD_CONFIGURATION: 'Release'
    TEST_VERBOSITY: minimal
    SUMMARIZE_FAILURES: true

jobs:
    storage-integration:
        name: S3 and Azure Blob integration
        runs-on: ubuntu-latest
        timeout-minutes: 15
        env:
            TRANSFERETTO_S3_ENDPOINT: http://127.0.0.1:9000
            TRANSFERETTO_S3_ACCESS_KEY: minioadmin
            TRANSFERETTO_S3_SECRET_KEY: minioadmin
            TRANSFERETTO_AZURE_CONNECTION_STRING: DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup .NET
              uses: actions/setup-dotnet@v6
              with:
                  dotnet-version: ${{ env.DOTNET_VERSION }}

            - name: Start storage emulators
              shell: bash
              run: |
                  docker run --detach --name transferetto-minio \
                    --publish 9000:9000 \
                    --env MINIO_ROOT_USER=minioadmin \
                    --env MINIO_ROOT_PASSWORD=minioadmin \
                    minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
                  docker run --detach --name transferetto-azurite \
                    --publish 10000:10000 \
                    mcr.microsoft.com/azure-storage/azurite:3.35.0 \
                    azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck
                  for attempt in {1..30}; do
                    if curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null &&
                       curl --silent http://127.0.0.1:10000/devstoreaccount1?comp=list >/dev/null; then
                      exit 0
                    fi
                    sleep 1
                  done
                  docker logs transferetto-minio
                  docker logs transferetto-azurite
                  exit 1

            - name: Run storage provider integration tests
              run: dotnet test Sources/Transferetto.Tests/Transferetto.Tests.csproj --configuration ${{ env.BUILD_CONFIGURATION }} --framework net8.0 --verbosity ${{ env.TEST_VERBOSITY }}

    test-windows:
        name: Windows
        runs-on: windows-latest
        timeout-minutes: 15
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup .NET
              uses: actions/setup-dotnet@v6
              with:
                  dotnet-version: ${{ env.DOTNET_VERSION }}

            - name: Restore dependencies
              run: dotnet restore Transferetto.sln

            - name: Build solution
              run: dotnet build Transferetto.sln --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore

            - name: Run tests (.NET Framework 4.7.2)
              run: dotnet test Sources/Transferetto.Tests/Transferetto.Tests.csproj --configuration ${{ env.BUILD_CONFIGURATION }} --framework net472 --no-build --verbosity ${{ env.TEST_VERBOSITY }} --logger "console;verbosity=${{ env.TEST_VERBOSITY }}" --logger trx

            - name: Run tests (.NET 8.0)
              run: dotnet test Sources/Transferetto.Tests/Transferetto.Tests.csproj --configuration ${{ env.BUILD_CONFIGURATION }} --framework net8.0 --no-build --verbosity ${{ env.TEST_VERBOSITY }} --logger "console;verbosity=${{ env.TEST_VERBOSITY }}" --logger trx --collect:"XPlat Code Coverage"

            - name: Summarize failing tests
              if: failure() && env.SUMMARIZE_FAILURES == 'true'
              shell: pwsh
              run: |
                  $trxFiles = Get-ChildItem -Recurse -Filter *.trx
                  if ($trxFiles.Count -eq 0) {
                    Write-Host "No TRX files found for failure analysis"
                    exit 0
                  }

                  Write-Host "=== Failed Tests Summary ==="
                  $failureCount = 0

                  $trxFiles | ForEach-Object {
                    try {
                      Select-Xml -Path $_.FullName -XPath "//UnitTestResult[@outcome='Failed']" |
                        ForEach-Object {
                          $name = $_.Node.testName
                          $msg = $_.Node.Output.ErrorInfo.Message ?? "No error message available"
                          Write-Host "FAILED: $name"
                          Write-Host "   $msg"
                          $failureCount++
                        }
                    } catch {
                      Write-Host "Warning: Could not parse TRX file $($_.Name): $($_.Exception.Message)"
                    }
                  }

                  if ($failureCount -eq 0) {
                    Write-Host "No failed tests found in TRX files"
                  } else {
                    Write-Host "=== Total failed tests: $failureCount ==="
                  }

            - name: Upload test results
              uses: actions/upload-artifact@v7
              if: always()
              with:
                  name: test-results-windows
                  path: '**/*.trx'

            - name: Upload coverage reports
              uses: actions/upload-artifact@v7
              if: always()
              with:
                  name: coverage-reports-windows
                  path: '**/coverage.cobertura.xml'

    test-ubuntu:
        name: Ubuntu
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup .NET
